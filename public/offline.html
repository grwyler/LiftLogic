<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Lift Logic Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Instrument Sans", sans-serif;
        background: radial-gradient(circle at top, #1f2937 0%, #0f172a 70%);
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border-radius: 28px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 20px 48px rgba(2, 6, 23, 0.34);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: rgba(226, 232, 240, 0.88);
        line-height: 1.65;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 14px;
        font-size: 0.76rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Lift Logic</div>
      <h1>You are offline.</h1>
      <p>
        The app shell is still available, but this screen needs a connection before Lift Logic can
        refresh workout data. Reconnect and reopen the page to keep training moving.
      </p>
    </main>
  </body>
</html>
